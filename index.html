      const q='[out:json][timeout:60];area(3604110492)->.a;(nwr(area.a)["amenity"~"^(police|fire_station|townhall|hospital|clinic|pharmacy|school|college|university|library|museum|arts_centre|theatre|cinema|post_office|marketplace)$"];nwr(area.a)["tourism"~"^(museum|gallery|attraction|theme_park|zoo|aquarium)$"];nwr(area.a)["healthcare"~"^(hospital|clinic|pharmacy|centre)$"];nwr(area.a)["leisure"~"^(park|playground|sports_centre|stadium|amusement_arcade|escape_game|water_park)$"];nwr(area.a)["shop"~"^(supermarket|mall|department_store|variety_store)$"];nwr(area.a)["office"="government"]["name"~"(행정복지센터|주민센터|구청|시청)$"];nwr(area.a)["name"~"(파출소|지구대|병원|박물관|미술관|학교|도서관|문화회관|체험관|극장|영화관|다이소|백화점|마트)$"];);out center tags;';
      try{
        $("mapStatus").textContent="동래구의 도움 장소를 모으고 있어요";
        const response=await fetch("https://overpass-api.de/api/interpreter?data="+encodeURIComponent(q));
        if(!response.ok)throw new Error("장소 데이터 응답 오류");
        const json=await response.json();
        const found=json.elements.map(e=>{
          const name=e.tags?.name||"",type=/충렬사|동래읍성|동래향교/.test(name)?"historic_site":/(파출소|지구대)$/.test(name)?"police":/(행정복지센터|주민센터|구청|시청)$/.test(name)?"townhall":/병원$/.test(name)?"hospital":/미술관$/.test(name)?"gallery":/박물관$/.test(name)?"museum":/도서관$/.test(name)?"library":/학교$/.test(name)?"school":/문화회관$/.test(name)?"arts_centre":/체험관$/.test(name)?"experience":/영화관$/.test(name)?"cinema":/극장$/.test(name)?"theatre":/다이소/.test(name)?"variety_store":/백화점$/.test(name)?"department_store":/마트$/.test(name)?"supermarket":e.tags?.amenity||e.tags?.tourism||e.tags?.healthcare||e.tags?.leisure||e.tags?.shop,info=placeTypes[type],lat=e.lat||e.center?.lat,lng=e.lon||e.center?.lon;
          if(!info||!name||!lat||!lng)return null;
          if(info[0]==="건강·의료"&&!majorHospitalNames.has(name))return null;
          if(type==="school"&&!/초등학교/.test(name))return null;
          if(type==="supermarket"&&!/(홈플러스|이마트|롯데마트|메가마트|코스트코|하나로마트|농협|트레이더스)/.test(name))return null;
          if(info[0]==="놀이·여가"){
            const operator=e.tags?.operator||"",housing=/(아파트|APT|단지|주공|빌라|오피스텔|관리사무소)/i;
            if(housing.test(name)||housing.test(operator))return null;
            const trustedType=["museum","gallery","arts_centre","theatre","cinema","stadium","sports_centre","zoo","aquarium","historic_site"].includes(type);
            const publicName=/(공원|시민|문화회관|박물관|미술관|체육센터|체육관|운동장|야구장|온천천|금강)/.test(name);
            const knownOperator=operator&&!/(개인|주민|입주자|아파트)/.test(operator);
            if(!trustedType&&!publicName&&!knownOperator)return null;
          }
          const commons=e.tags?.wikimedia_commons,photo=e.tags?.image||(commons?.startsWith("File:")?"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(commons.slice(5)):"");
          return [name,info[0],lat,lng,info[1],`${info[2]}이에요.`,helpTexts[type]||"사람들이 생활하고 배우고 쉬는 데 필요한 도움을 주는 곳이에요.","","",`이 장소가 없다면 우리 생활에서 어떤 점이 불편할까요?`,"https://www.openstreetmap.org/?mlat="+lat+"&mlon="+lng+"#map=17/"+lat+"/"+lng,photo,info[2]];
        }).filter(Boolean);
        const merged=[...data,...found],seen=new Set();
        data=merged.filter(p=>{const key=p[0]+"|"+p[2].toFixed(4)+"|"+p[3].toFixed(4);if(seen.has(key))return false;seen.add(key);return true});
        selected=filtered()[0]||data[0];render();$("mapStatus").textContent=`동래구 도움 장소 ${data.length}곳을 표시했어요`;
      }catch(error){
        $("mapStatus").textContent="기본 장소를 표시했어요 · 잠시 후 새로고침하면 전체 장소를 불러와요";
      }
    }
    window.initPublicMap=function(){
      if(!window.L){$("mapStatus").textContent="지도를 다시 불러와 주세요";return}
      render();
      leafletMap=L.map("naverMap",{minZoom:12,maxZoom:17,maxBounds:busanBounds,maxBoundsViscosity:1,scrollWheelZoom:false,doubleClickZoom:false}).setView(initialCenter,initialZoom);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(leafletMap);
      $("mapShell").classList.add("live");$("markers").style.display="none";$("mapStatus").textContent="마커를 눌러 장소를 탐구해 보세요";renderMapMarkers();loadAllPlaces();
    };
    $("resetMap").onclick=function(){
      $("mapStatus").textContent="원래 지도 위치로 이동합니다.";
      if(leafletMap)leafletMap.setView(initialCenter,initialZoom,{animate:true});
      setTimeout(()=>{$("mapStatus").textContent="마커를 눌러 장소를 탐구해 보세요"},1800);
    };
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
