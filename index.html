<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ROAD ON LINK 우리 지역 도움 장소 지도</title>
  <meta name="description" content="부산 동래구의 도움 장소를 탐구하는 지도">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f2fb;color:#273148;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}button,a{font:inherit}.top{padding:16px 4vw;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(100deg,#fffdf8,#f2edff);border-bottom:1px solid #e4ddf0}.brand{display:flex;gap:14px;align-items:center}.pin{display:grid;place-items:center;width:52px;height:52px;border-radius:18px 18px 18px 5px;background:linear-gradient(145deg,#745ce1,#ed6b87);color:#fff;font-size:24px}.brand small{color:#725fbd;font-weight:800}.brand h1{margin:3px 0 0;font-size:clamp(22px,2.3vw,34px)}.progress{font-weight:900;color:#654fc1}.topics{padding:14px 4vw;display:flex;gap:8px;overflow:auto;background:#fff}.topics button{white-space:nowrap;border:1px solid #ddd6e8;border-radius:99px;padding:10px 15px;background:#faf9fc;font-weight:800;cursor:pointer}.topics button.on{background:#6652c5;color:#fff;border-color:#6652c5}.video{padding:10px 4vw;background:#fff7d6;border-block:1px solid #eee0a1;display:flex;gap:10px;align-items:center;overflow:auto}.video b{white-space:nowrap}.video a,.video span{white-space:nowrap;text-decoration:none;color:#594d65;background:#fff;padding:8px 11px;border:1px solid #eadfa8;border-radius:10px;font-size:13px}.workspace{padding:16px 4vw;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,410px);gap:16px}.map{min-height:570px;position:relative;overflow:hidden;border:5px solid #fff;border-radius:25px;background:linear-gradient(145deg,#eef3dc,#dbead0);box-shadow:0 10px 30px #3c36531a}.map:before,.map:after{content:"";position:absolute;inset:22% -8%;border:25px solid #fffdf6;border-radius:45%;rotate:-13deg;box-shadow:0 0 0 3px #d5cfbd}.map:after{inset:-20% 45%;rotate:27deg}.map.live:before,.map.live:after,.map.live>.river,.map.live>.district{display:none}.naver-map{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .25s}.map.live .naver-map{opacity:1}.river{position:absolute;width:58px;height:140%;left:75%;top:-20%;background:#b5e1ec;rotate:12deg;border-inline:2px solid #92c9d5}.district{position:absolute;left:5%;bottom:5%;font-size:42px;font-weight:900;color:#43554118}.marker{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer}.marker i,.naver-pin i{font-style:normal;display:grid;place-items:center;width:48px;height:48px;border:4px solid #fff;border-radius:50% 50% 50% 8px;background:#6652c5;box-shadow:0 5px 13px #33287355;font-size:22px;color:#fff}.marker b,.naver-pin b{margin-top:4px;padding:5px 8px;white-space:nowrap;border-radius:8px;background:#fff2a4;font-size:12px;box-shadow:0 2px 8px #4c472c2e}.marker.active i,.naver-pin.active i{background:#858b98;transform:scale(1.12)}.naver-pin{display:flex;flex-direction:column;align-items:center;border:0;background:transparent;cursor:pointer}.notice{position:absolute;z-index:4;left:18px;top:18px;padding:10px 14px;border-radius:14px;background:#ffffffdf;box-shadow:0 5px 18px #3b493828}.notice small{display:block;color:#756f7b;margin-top:3px}.count{position:absolute;z-index:4;left:16px;bottom:16px;padding:9px 12px;border-radius:12px;background:#29334cdd;color:#fff;font-weight:800;font-size:13px}.card{background:#fffdf8;border-radius:25px;padding:22px;box-shadow:0 10px 30px #3c36531a}.card-top{display:flex;gap:14px;padding-bottom:16px;border-bottom:1px dashed #ddd5e7}.icon{display:grid;place-items:center;flex:0 0 64px;height:64px;border-radius:20px;background:#efecff;font-size:32px}.category{display:inline-block;padding:4px 8px;border-radius:7px;background:#efecff;color:#5947b0;font-size:12px;font-weight:900}.card h2{margin:6px 0;font-size:25px}.desc{margin:0;color:#706a78;line-height:1.5;font-size:14px}.help{margin:16px 0;padding:14px;border-radius:16px;background:#f0edff}.help b{color:#5946ad}.help p{margin:5px 0 0;line-height:1.5}.rows div{padding:10px 3px;border-bottom:1px solid #eee9f2;font-size:13px;line-height:1.5}.rows b{display:inline-block;width:105px}.question{margin-top:15px;padding:14px;border-radius:17px;background:#fff3b6;border:1px solid #eddd8d}.question b{font-size:12px}.question p{margin:5px 0 0;font-weight:800;line-height:1.5}.actions{display:flex;gap:8px;margin-top:13px}.actions a,.actions span{flex:1;text-align:center;padding:10px;border-radius:10px;font-size:13px;font-weight:800}.actions a{background:#6652c5;color:#fff;text-decoration:none}.actions span{background:#eeeaf1;color:#87808d}.place-list{display:flex;gap:7px;overflow:auto;margin-top:14px}.place-list button{white-space:nowrap;border:1px solid #ded7e8;border-radius:10px;background:#fff;padding:8px 10px;font-size:12px;font-weight:800;cursor:pointer}.place-list button.on{background:#efecff;border-color:#8c7ad4;color:#5947b0}footer{padding:11px 4vw;background:#293148;color:#e7e2f5;font-size:12px;display:flex;justify-content:space-between}footer b{color:#ffdc73}@media(max-width:900px){.workspace{grid-template-columns:1fr}.map{min-height:480px}}@media(max-width:600px){.top{padding:12px}.brand h1{font-size:20px}.progress{display:none}.workspace{padding:12px}.map{min-height:430px;border-radius:19px}.card{border-radius:19px;padding:17px}footer{flex-direction:column;gap:4px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><div class="pin">♥</div><div><small>ROAD ON LINK · 우리 동네 탐구</small><h1>우리 지역 도움 장소 지도</h1></div></div><div class="progress">탐구한 장소 <span id="progress">0 / 10</span></div></header>
  <nav class="topics" id="topics" aria-label="장소 주제 선택"></nav>
  <section class="video"><b>▶ 함께 보고 알아봐요</b><a href="https://www.youtube.com/results?search_query=우리+동네+공공기관+초등" target="_blank">🎬 도움 장소 알아보기</a><a href="https://www.youtube.com/results?search_query=경찰서+소방서+하는+일+어린이" target="_blank">🚒 경찰서·소방서가 하는 일</a><span>🌱 새 영상 준비 중</span></section>
  <main class="workspace">
    <section class="map" id="mapShell" aria-label="동래구 도움 장소 지도"><div id="naverMap" class="naver-map"></div><div class="river"></div><div class="district">부산 동래구</div><div class="notice"><b>🗺️ 동래구 도움 지도</b><small id="mapStatus">네이버 지도를 불러오는 중이에요</small></div><div id="markers"></div><div class="count" id="count"></div></section>
    <article class="card"><div class="card-top"><div class="icon" id="icon"></div><div><span class="category" id="category"></span><h2 id="title"></h2><p class="desc" id="desc"></p></div></div><div class="help"><b>💡 어떤 도움을 받을까요?</b><p id="help"></p></div><div class="rows"><div><b>🕐 이용 시간</b><span id="hours"></span></div><div><b>⭐ 기억할 점</b><span id="tip"></span></div></div><div class="question"><b>생각 톡톡!</b><p id="question"></p></div><div class="actions"><a id="source" target="_blank">홈페이지 보기 ↗</a><span>영상 설명 준비 중</span></div><div class="place-list" id="list"></div></article>
  </main>
  <footer><span>마커를 눌러 우리 동네의 도움 장소를 탐구해 보세요!</span><b>위급할 땐 112 · 119</b></footer>
  <script>
    const data=[
      ["동래구청","공공기관",35.2056,129.0839,"🏛️","동래구의 여러 행정 일을 맡아보는 곳이에요.","생활에 필요한 민원과 지역 정보를 안내받을 수 있어요.","평일 09:00~18:00","방문 전 필요한 서류를 전화나 홈페이지에서 확인해요.","구청은 우리 동네의 어떤 문제를 해결해 줄까요?","https://www.dongnae.go.kr/"],
      ["사직2동 행정복지센터","생활을 돕는 곳",35.1987,129.0623,"🤝","주민의 생활과 복지를 가까이에서 돕는 곳이에요.","각종 증명서와 복지 서비스 상담을 받을 수 있어요.","평일 09:00~18:00","방문 전에 필요한 서류를 확인해요.","행정복지센터를 이용한다면 언제일까요?","https://www.dongnae.go.kr/"],
      ["부산동래경찰서","안전을 돕는 곳",35.2049,129.0778,"🛡️","우리 지역의 질서와 안전을 지키는 곳이에요.","위험한 일을 신고하고 잃어버린 물건을 문의할 수 있어요.","긴급 신고는 언제나 112","긴급하지 않은 문의와 112 신고를 구분해요.","경찰서가 없다면 생활은 어떻게 달라질까요?","https://www.bspolice.go.kr/dongnae/"],
      ["온천119안전센터","안전을 돕는 곳",35.2191,129.0817,"🚒","화재를 끄고 위급한 사람을 구조하는 곳이에요.","불이나 응급 상황이 생기면 119로 도움을 요청해요.","긴급 출동은 24시간","장난 전화는 꼭 필요한 사람의 도움을 늦출 수 있어요.","가장 가까운 안전센터는 어디일까요?","https://119.busan.go.kr/"],
      ["동래구보건소","건강을 돕는 곳",35.2045,129.0832,"❤️","주민이 건강하게 지내도록 예방과 상담을 돕는 곳이에요.","예방접종, 건강 검사와 건강 상담을 받을 수 있어요.","평일 09:00~18:00","검사나 예방접종은 먼저 예약 여부를 확인해요.","아프기 전에도 보건소를 찾는 이유는 무엇일까요?","https://www.dongnae.go.kr/health/"],
      ["동래읍성도서관","배움을 돕는 곳",35.2098,129.0905,"📚","책을 읽고 자료를 찾으며 공부할 수 있는 곳이에요.","필요한 정보를 찾고 독서 프로그램에 참여할 수 있어요.","운영일과 자료실별 시간이 달라요","작은 목소리로 이야기하고 반납일을 지켜요.","도서관에서 책 말고 어떤 도움을 받을까요?","https://library.busan.go.kr/dongnae/"],
      ["사직도서관","배움을 돕는 곳",35.1966,129.0548,"📖","책과 문화 프로그램을 만날 수 있는 배움터예요.","독서, 조사, 과제와 문화 활동에 도움을 받을 수 있어요.","자료실별 운영 시간은 홈페이지 확인","회원증이 필요한지 방문 전에 확인해요.","도서관에서 해 보고 싶은 활동은 무엇인가요?","https://library.busan.go.kr/sajik/"],
      ["도시철도 동래역","생활을 돕는 곳",35.2055,129.0786,"🚇","여러 지역으로 안전하고 편리하게 이동하도록 돕는 곳이에요.","길 찾기와 교통카드 이용 안내를 받을 수 있어요.","첫차·막차 시간은 교통공사 확인","안전선 안쪽에서 기다리고 뛰지 않아요.","지하철역은 어떤 불편을 줄여 줄까요?","https://www2.humetro.busan.kr/"],
      ["금강공원","자연·쉼터",35.2238,129.0773,"🌳","도심에서 자연을 느끼며 쉬고 운동할 수 있는 곳이에요.","산책과 놀이, 휴식으로 몸과 마음을 건강하게 해요.","시설별 이용 시간이 달라요","쓰레기는 되가져가고 정해진 길을 이용해요.","공원이 마음 건강에도 도움을 주는 이유는 무엇일까요?","https://www.busan.go.kr/geumgangpark/"],
      ["온천천 시민공원","자연·쉼터",35.2117,129.1014,"🌿","물길을 따라 걷고 자연을 관찰할 수 있는 쉼터예요.","가볍게 운동하고 계절의 동식물을 관찰할 수 있어요.","상시 이용 가능","자전거와 보행자 길을 구분하고 물가를 조심해요.","자연 쉼터를 지키려면 무엇을 할 수 있을까요?","https://www.dongnae.go.kr/"]
    ];
    const cats=[["전체","✨"],["공공기관","🏛️"],["안전을 돕는 곳","🛡️"],["건강을 돕는 곳","❤️"],["배움을 돕는 곳","📚"],["생활을 돕는 곳","🤝"],["자연·쉼터","🌳"]];
    let cat="전체",selected=data[0],visited=new Set(),naverMap=null,naverMarkers=[];
    const $=id=>document.getElementById(id);
    function filtered(){return cat==="전체"?data:data.filter(p=>p[1]===cat)}
    function select(p){selected=p;visited.add(p[0]);$("progress").textContent=visited.size+" / "+data.length;render();if(naverMap&&window.naver)naverMap.panTo(new naver.maps.LatLng(p[2],p[3]))}
    function render(){
      $("topics").innerHTML=cats.map(c=>`<button class="${cat===c[0]?"on":""}" data-cat="${c[0]}">${c[1]} ${c[0]}</button>`).join("");
      const f=filtered(); $("count").textContent=`● 도움 장소 ${f.length}곳`;
      $("markers").innerHTML=f.map((p,i)=>{const left=Math.min(88,Math.max(9,12+((p[3]-129.05)/.055)*72)),top=20+(i%4)*18;return`<button class="marker ${selected===p?"active":""}" data-place="${p[0]}" style="left:${left}%;top:${top}%"><i>${selected===p?"✓":p[4]}</i><b>${p[0]}</b></button>`}).join("");
      $("list").innerHTML=f.map(p=>`<button class="${selected===p?"on":""}" data-place="${p[0]}">${visited.has(p[0])?"✓":p[4]} ${p[0]}</button>`).join("");
      $("icon").textContent=selected[4];$("category").textContent=selected[1];$("title").textContent=selected[0];$("desc").textContent=selected[5];$("help").textContent=selected[6];$("hours").textContent=selected[7];$("tip").textContent=selected[8];$("question").textContent=selected[9];$("source").href=selected[10];
      document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;selected=filtered()[0];render()});
      document.querySelectorAll("[data-place]").forEach(b=>b.onclick=()=>select(data.find(p=>p[0]===b.dataset.place)));
      renderNaverMarkers();
    } render();
    function renderNaverMarkers(){
      if(!naverMap||!window.naver)return;
      naverMarkers.forEach(m=>m.setMap(null));
      naverMarkers=filtered().map(p=>{
        const active=selected===p;
        const marker=new naver.maps.Marker({map:naverMap,position:new naver.maps.LatLng(p[2],p[3]),title:p[0],icon:{content:`<button class="naver-pin ${active?"active":""}" aria-label="${p[0]}"><i>${active?"✓":p[4]}</i><b>${p[0]}</b></button>`,anchor:new naver.maps.Point(27,58)}});
        naver.maps.Event.addListener(marker,"click",()=>select(p));
        return marker;
      });
    }
    window.initNaverMap=function(){
      if(!window.naver||!naver.maps){$("mapStatus").textContent="지도 연결을 확인해 주세요";return}
      naverMap=new naver.maps.Map("naverMap",{center:new naver.maps.LatLng(35.2056,129.0786),zoom:14,minZoom:12,maxZoom:18,mapTypeControl:false});
      $("mapShell").classList.add("live");$("markers").style.display="none";$("mapStatus").textContent="마커를 눌러 장소를 탐구해 보세요";renderNaverMarkers();
    };
  </script>
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=6kyen4rscl"></script>
  <script>
    if(window.naver&&window.naver.maps){
      window.initNaverMap();
    }else{
      document.getElementById("mapStatus").textContent="지도 연결을 확인해 주세요";
    }
  </script>
</body>
</html>
